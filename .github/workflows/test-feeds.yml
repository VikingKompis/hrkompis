name: Test employer feeds

# Try candidate careers-site feeds without touching the live data.
# Reads companies/candidates.json ({country: [employer, ...]}) and prints jobs found / errors per employer.
on:
  push:
    paths: ["companies/candidates.json"]
  workflow_dispatch:
    inputs:
      file:
        description: "Candidate file"
        default: "companies/candidates.json"

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          cd scripts && python -c "
          import json, employers as em
          data, status = em.run_all('../${{ github.event.inputs.file || 'companies/candidates.json' }}')
          for s in sorted(status, key=lambda s: (s['name'], s['c'])):
              print(f\"RESULT {s['c']} | {s['name']} | {s['type']} | jobs={s['jobs']} | {s['error'] or 'ok'} | {s['secs']}s\")
          json.dump({'status': status, 'sample': data[:600]}, open('../raw/candidates_result.json', 'w'), ensure_ascii=False, indent=1)
          "
      - run: |
          git config user.name "hrkompis-bot"
          git config user.email "hrkompis-bot@users.noreply.github.com"
          git add raw/candidates_result.json
          git commit -m "Feed test results" || echo "No changes"
          git pull --rebase -q && git push
